<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr Sophie Joscelyne</title>
  <style>
    :root {
      --font: "Gill Sans", "Gill Sans MT", Calibri, -apple-system, sans-serif;
      --bg: #faf9f6;
      --text-main: #1f2328;
      --text-muted: #656d76;
      --accent: #1e3a5f;
      --border: #e2e0d9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
      color: #111;
    }

    .role {
      font-size: 0.98rem;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      width: 40px;
      margin: 0 auto 24px;
    }

    .status {
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .email-link {
      display: inline-block;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }

    .email-link:hover {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Dr Sophie Joscelyne</h1>
    <p class="role">Fondazione 1563 &bull; Turin</p>

    <div class="divider"></div>

    <p class="status">Website coming soon</p>
    <a class="email-link" href="mailto:contact@sophiejoscelyne.com">contact@sophiejoscelyne.com</a>
  </main>

</body>
</html>
